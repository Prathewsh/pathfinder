[package]
name = "pathfinder"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "brotli", "gzip", "deflate"] }
scraper = "0.18"
url = "2.4"
clap = { version = "4.4", features = ["derive"] }
dashmap = "5.5"
regex = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
quick-xml = "0.31"
governor = "0.6"
nonzero_ext = "0.3"
